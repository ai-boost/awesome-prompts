name: Check internal links

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-internal-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/check_internal_links.py
